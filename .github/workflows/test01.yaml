name: 01 - Hello World

on: workflow_dispatch   # "Run workflow" button in the Actions tab (manual trigger)

jobs:
  say-hello:                     # <- job id (you choose this name)
    runs-on: ubuntu-latest       # <- GitHub-hosted Linux runner
    steps:
      - name: Print a greeting - step 1
        run: echo "Hello, GitHub Actions! 👋 line 1"

      - name: Print multiple lines - step 2
        run: |
          echo "This step runs several shell commands. line 1"
          echo "Today's runner is: $RUNNER_OS line 2"
          echo "The repository is: $GITHUB_REPOSITORY line 3"
